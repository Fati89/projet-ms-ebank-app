spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      # Désactivez la découverte de services si vous n'utilisez pas Eureka
      discovery:
        locator:
          enabled: false
      routes:
        - id: customer-service
          uri: http://localhost:8081
          predicates:
            - Path=/customers/**
        - id: ebank-service
          uri: http://localhost:8082
          predicates:
            - Path=/accounts/**